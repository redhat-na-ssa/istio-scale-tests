{{- $mode := include "kiali.mode" . }}
{{- /*
  PreDelete hook: delete the Kiali CRs first and wait for the operator to remove what it created
  for them (OAuthClient, roles, ServiceAccount), then the Subscription (so OLM cannot reinstall
  the CSV) and the CSV by its OLM label, as charts/cert-manager-operator does. A CR the operator
  does not finish within 300 s loses its finalizer, so the Application can still go.
*/}}
{{- $ns := .Values.operatorNamespace }}
{{- $kns := .Values.kialiNamespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali-cleanup
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kiali-cleanup
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kiali-cleanup
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kiali-cleanup
subjects:
  - kind: ServiceAccount
    name: kiali-cleanup
    namespace: {{ $ns | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kiali-cleanup
  namespace: {{ $kns | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kiali.io"]
    resources: ["kialis"]
    verbs: ["get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kiali-cleanup
  namespace: {{ $kns | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kiali-cleanup
subjects:
  - kind: ServiceAccount
    name: kiali-cleanup
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kiali-cleanup
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiali-cleanup
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: kiali-cleanup
      restartPolicy: Never
      containers:
        - name: cleanup
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS={{ $ns | quote }}
              KIALI_NS={{ $kns | quote }}
              SUB={{ .Values.subscription.name | quote }}
              PACKAGE={{ .Values.subscription.package | quote }}
              echo "Deleting the Kiali CRs in $KIALI_NS..."
              oc delete kialis.kiali.io --all -n "$KIALI_NS" --ignore-not-found --wait=false || true
              deadline=$(( $(date +%s) + 300 ))
              left="$(oc get kialis.kiali.io -n "$KIALI_NS" -o name 2>/dev/null || true)"
              while [ -n "$left" ] && [ "$(date +%s)" -lt "$deadline" ]; do
                echo "Waiting for the Kiali operator to remove: ${left//$'\n'/ }"
                sleep 5
                left="$(oc get kialis.kiali.io -n "$KIALI_NS" -o name 2>/dev/null || true)"
              done
              for k in $left; do
                echo "WARNING: $k is still there after 300 s; removing its finalizer. Its OAuthClient, roles or ServiceAccount may be left behind."
                oc patch "$k" -n "$KIALI_NS" --type=merge -p '{"metadata":{"finalizers":null}}' || true
              done
              echo "Deleting Subscription $SUB in $NS..."
              oc delete subscription.operators.coreos.com "$SUB" -n "$NS" --ignore-not-found --wait=false || true
              echo "Deleting CSVs labelled operators.coreos.com/${PACKAGE}.${NS} in $NS..."
              oc delete csv -n "$NS" -l "operators.coreos.com/${PACKAGE}.${NS}" --ignore-not-found --wait=false || true
              echo "Cleanup complete."
