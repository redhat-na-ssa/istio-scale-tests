{{- if and (eq (include "kiali.mode" .) "hub") .Values.rbac.enabled }}
{{- $name := printf "%s-argocd-sync" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- range $ns := list .Values.operatorNamespace .Values.kialiNamespace }}
---
# Lets the OpenShift GitOps application controller create in {{ $ns }} the hook Jobs with their
# ServiceAccounts and Roles
{{- if eq $ns $.Values.kialiNamespace }}, the Kiali CR and its member list ConfigMap{{ end }}.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  {{- if $.Values.argoSyncWaves.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.argoSyncWaves.rbac | quote }}
  {{- end }}
  labels:
    {{- include "kiali.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if eq $ns $.Values.kialiNamespace }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kiali.io"]
    resources: ["kialis"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  {{- if $.Values.argoSyncWaves.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.argoSyncWaves.rbac | quote }}
  {{- end }}
  labels:
    {{- include "kiali.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.rbac.argocd.serviceAccountName | quote }}
    namespace: {{ $.Values.rbac.argocd.namespace | quote }}
{{- end }}
{{- end }}
