{{- if eq (include "kiali.mode" .) "remote" }}
# Long-lived token of the ServiceAccount the operator creates for the Kiali CR. The hub copies
# it into Kiali's remote cluster secret (charts/hub-kiali-remote-secret). Kubernetes fills in
# the data (the ApplicationSet ignores /data) and deletes the Secret if the ServiceAccount does
# not exist yet, hence the later wave.
apiVersion: v1
kind: Secret
metadata:
  name: kiali-service-account
  namespace: {{ .Values.kialiNamespace | quote }}
  annotations:
    {{- if .Values.argoSyncWaves.enabled }}
    argocd.argoproj.io/sync-wave: {{ .Values.argoSyncWaves.token | quote }}
    {{- end }}
    kubernetes.io/service-account.name: kiali-service-account
  labels:
    {{- include "kiali.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
{{- end }}
