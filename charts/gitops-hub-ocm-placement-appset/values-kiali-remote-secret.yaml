# Preset, OpenShift add-on (terraform/platform kiali_multicluster): on the hub, one Application
# per mesh member that builds the member's Kiali remote cluster secret
# (charts/hub-kiali-remote-secret).
identity:
  component: hub-kiali-remote-secret

placementRbac:
  roleName: openshift-gitops-ocm-placement-hub-kiali-remote-secret
  roleBindingName: openshift-gitops-ocm-placement-hub-kiali-remote-secret

argocdApplicationControllerRbac:
  roleName: gitops-hub-kiali-remote-secret-appset-argocd-sync
  roleBindingName: gitops-hub-kiali-remote-secret-appset-argocd-sync

applicationSet:
  name: hub-kiali-remote-secret

destination:
  mode: inClusterServer
  # The hub Kiali's namespace; the chart also writes to external-secrets-operator.
  namespace: istio-system

template:
  applicationNameSuffix: hub-kiali-remote-secret
  source:
    path: charts/hub-kiali-remote-secret
    helm:
      # Not the Application's name: <member>-hub-kiali-remote-secret passes Helm's 53-character
      # release name limit from a 30-character member name. The chart names its objects from
      # clusterName, so the members' releases share this name without colliding.
      releaseName: kiali-remote-secret
  syncOptions:
    - CreateNamespace=true
