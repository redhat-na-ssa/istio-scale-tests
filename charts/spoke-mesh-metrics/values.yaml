# Set per member by the ApplicationSet (values-mesh-metrics.yaml); used in labels only.
clusterName: ""

# The one namespace this release covers: one Application per member and namespace
# (terraform/platform acm_observability.istio_metrics_namespaces); Argo CD creates it when missing.
namespace: istio-system

# istiod's namespace. Its release also scrapes istiod and owns user workload monitoring.
istioNamespace: istio-system

userWorkloadMonitoring:
  # openshift-monitoring/cluster-monitoring-config with only enableUserWorkload: true. false when
  # the member already has that ConfigMap: add enableUserWorkload: true to it yourself.
  enabled: true

# ACM's collector federates every observabilityAddonSpec.interval (60 s here), so faster
# scraping only adds load on the member.
scrapeInterval: 60s

# Exact names (the ACM allowlist matches names, not patterns), kept at scrape time and allowlisted.
istiodMetrics:
  - pilot_info
  - pilot_proxy_convergence_time_sum
  - pilot_proxy_convergence_time_count
  - pilot_services
  - pilot_xds
  - pilot_xds_pushes
  - process_cpu_seconds_total
  - process_resident_memory_bytes
  - istio_build
proxyMetrics:
  - istio_requests_total
  - istio_request_duration_milliseconds_bucket
  - istio_request_duration_milliseconds_sum
  - istio_request_duration_milliseconds_count
  - istio_request_bytes_bucket
  - istio_request_bytes_sum
  - istio_request_bytes_count
  - istio_response_bytes_bucket
  - istio_response_bytes_sum
  - istio_response_bytes_count
  - istio_request_messages_total
  - istio_response_messages_total
  - istio_tcp_sent_bytes_total
  - istio_tcp_received_bytes_total
  - istio_tcp_connections_opened_total
  - istio_tcp_connections_closed_total
  - istio_build
  - envoy_cluster_upstream_cx_active
  - envoy_cluster_upstream_rq_total
  - envoy_listener_downstream_cx_active
  - envoy_listener_http_downstream_rq
  - envoy_server_memory_allocated
  - envoy_server_memory_heap_size
  - envoy_server_uptime

argoSyncWaves:
  enabled: true
  # Before the monitors, so the user-workload Prometheus that reads them exists first.
  userWorkloadMonitoring: "-10"
  monitors: "0"
