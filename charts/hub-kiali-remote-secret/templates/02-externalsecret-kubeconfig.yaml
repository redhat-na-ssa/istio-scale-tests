{{- if and .Values.clusterName .Values.clusterServer }}
{{- $m := .Values.clusterName }}
{{- /*
  Hop 1: a kubeconfig for the member with the read-only kiali-service-account token, in the ESO
  namespace. The CA comes from the hub's kubeconfig Secret; when it is empty (a member whose
  API certificate is publicly trusted) the kubeconfig has none. The ESO template expressions
  are escaped for Helm, as in charts/hub-mesh-push-secrets.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "kiali-kubeconfig-%s" $m | quote }}
  namespace: {{ .Values.esoNamespace | quote }}
  {{- with include "hub-kiali-remote-secret.waveAnnotations" (dict "root" $ "wave" "externalSecret") }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ printf "kiali-%s-member" $m | quote }}
    kind: SecretStore
  target:
    name: {{ printf "kiali-kubeconfig-%s" $m | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: {{ $m | quote }}
              cluster:
                server: {{ .Values.clusterServer | quote }}
          {{ "{{- with .ca | trim }}" }}
                certificate-authority-data: {{ "{{ . | b64enc }}" }}
          {{ "{{- end }}" }}
          contexts:
            - name: {{ $m | quote }}
              context:
                cluster: {{ $m | quote }}
                user: {{ $m | quote }}
          current-context: {{ $m | quote }}
          users:
            - name: {{ $m | quote }}
              user:
                token: {{ "{{ .token }}" }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.memberTokenSecret | quote }}
        property: token
    - secretKey: ca
      sourceRef:
        storeRef:
          name: {{ printf "kiali-%s-hub" $m | quote }}
          kind: SecretStore
      remoteRef:
        key: {{ include "hub-kiali-remote-secret.kubeconfigSecret" . | quote }}
        property: ca.crt
{{- end }}
