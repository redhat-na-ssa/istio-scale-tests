{{- if and .Values.clusterName .Values.clusterServer }}
{{- $m := .Values.clusterName }}
{{- $eso := .Values.esoNamespace }}
{{- $kns := .Values.kialiNamespace }}
{{- $kubeconfig := include "hub-kiali-remote-secret.kubeconfigSecret" . }}
{{- $wave := include "hub-kiali-remote-secret.waveAnnotations" (dict "root" $ "wave" "secretStore") }}
# Hop 1, hub side: the member's kubeconfig Secret, for its ca.crt.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "kiali-%s-hub" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $eso | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: {{ .Values.kubernetesAPI.caFromConfigMap.name | quote }}
          key: {{ .Values.kubernetesAPI.caFromConfigMap.key | quote }}
      auth:
        serviceAccount:
          name: {{ printf "kiali-%s-hub-reader" $m | quote }}
---
# Hop 1, member side: the token Secret of kiali-service-account, read from the member's API with
# the hub's kubeconfig credential. Never label it hub-mesh-push-secrets/push-target or
# hub-mesh-push-secrets/cluster-name: charts/hub-mesh-push-secrets pushes Istio secrets into
# every store with those labels.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "kiali-%s-member" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
    app.kubernetes.io/component: kiali-member-store
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.memberNamespace | quote }}
      server:
        url: {{ .Values.clusterServer | quote }}
{{- if not .Values.memberSecretStore.skipCAProvider }}
        caProvider:
          type: Secret
          name: {{ $kubeconfig | quote }}
          key: ca.crt
{{- end }}
      auth:
        token:
          bearerToken:
            name: {{ $kubeconfig | quote }}
            key: bearer-token
---
# Hop 2: hop 1's Secret, from {{ $kns }}.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "kiali-%s-eso" $m | quote }}
  namespace: {{ $kns | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $eso | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: {{ .Values.kubernetesAPI.caFromConfigMap.name | quote }}
          key: {{ .Values.kubernetesAPI.caFromConfigMap.key | quote }}
      auth:
        serviceAccount:
          name: {{ printf "kiali-%s-reader" $m | quote }}
{{- end }}
