{{- if and .Values.clusterName .Values.clusterServer }}
{{- $m := .Values.clusterName }}
{{- $eso := .Values.esoNamespace }}
{{- $kns := .Values.kialiNamespace }}
{{- $wave := include "hub-kiali-remote-secret.waveAnnotations" (dict "root" $ "wave" "secretStore") }}
# Hop 1's hub store: reads only the member's kubeconfig Secret (its ca.crt).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "kiali-%s-hub-reader" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "kiali-%s-hub-reader" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: [{{ include "hub-kiali-remote-secret.kubeconfigSecret" . | quote }}]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews", "selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "kiali-%s-hub-reader" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "kiali-%s-hub-reader" $m | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "kiali-%s-hub-reader" $m | quote }}
    namespace: {{ $eso | quote }}
---
# Hop 2's store (in {{ $kns }}): reads only hop 1's Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "kiali-%s-reader" $m | quote }}
  namespace: {{ $kns | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "kiali-%s-eso-reader" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: [{{ printf "kiali-kubeconfig-%s" $m | quote }}]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews", "selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "kiali-%s-eso-reader" $m | quote }}
  namespace: {{ $eso | quote }}
  {{- with $wave }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "kiali-%s-eso-reader" $m | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "kiali-%s-reader" $m | quote }}
    namespace: {{ $kns | quote }}
{{- end }}
