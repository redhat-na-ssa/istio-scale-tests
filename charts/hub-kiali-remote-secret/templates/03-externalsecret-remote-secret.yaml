{{- if and .Values.clusterName .Values.clusterServer }}
{{- $m := .Values.clusterName }}
{{- /*
  Hop 2: hop 1's kubeconfig as the Kiali remote cluster secret in the hub Kiali's namespace,
  where the operator finds it by label and mounts it under the cluster name (annotation and
  data key). Two hops because an ExternalSecret writes only into its own namespace and a
  SecretStore reads its auth Secret only from its own: one hop in the Kiali namespace would need
  the member's kubeconfig credential copied there. Kiali only ever holds the read-only token.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "kiali-remote-%s" $m | quote }}
  namespace: {{ .Values.kialiNamespace | quote }}
  {{- with include "hub-kiali-remote-secret.waveAnnotations" (dict "root" $ "wave" "externalSecret") }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "hub-kiali-remote-secret.labels" . | nindent 4 }}
    # Also on the ExternalSecret, so one selector lists it with its Secret (README).
    kiali.io/multiCluster: "true"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ printf "kiali-%s-eso" $m | quote }}
    kind: SecretStore
  target:
    name: {{ printf "kiali-remote-cluster-secret-%s" $m | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kiali.io/multiCluster: "true"
        annotations:
          kiali.io/cluster: {{ $m | quote }}
      data:
        {{ $m }}: "{{ "{{ .kubeconfig }}" }}"
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: {{ printf "kiali-kubeconfig-%s" $m | quote }}
        property: kubeconfig
{{- end }}
