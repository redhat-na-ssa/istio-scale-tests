{{- if and (include "gitops-hub-apps.enabled" (dict "root" $ "name" "hub-kiali-remote-secret-appset")) (eq (include "gitops-hub-apps.platform" .) "openshift") }}
# ApplicationSet, OpenShift add-on (kiali_multicluster): each mesh member's Kiali remote cluster
# secret on the hub (charts/hub-kiali-remote-secret).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-kiali-remote-secret-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "33"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: hub-kiali-remote-secret-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-hub-kiali-remote-secret-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "hub-kiali-remote-secret-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        - values-kiali-remote-secret.yaml
        - platform-openshift.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.gitopsNamespace | quote }}
  syncPolicy:
    {{- include "gitops-hub-apps.syncPolicy" . | nindent 4 }}
{{- end }}
