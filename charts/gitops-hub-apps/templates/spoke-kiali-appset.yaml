{{- if and (include "gitops-hub-apps.enabled" (dict "root" $ "name" "spoke-kiali-appset")) (eq (include "gitops-hub-apps.platform" .) "openshift") }}
# ApplicationSet, OpenShift add-on (kiali_multicluster): the Kiali operator and the resources
# the hub's Kiali needs on each mesh member (charts/kiali, mode remote).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-kiali-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "31"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: spoke-kiali-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-spoke-kiali-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "spoke-kiali-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        - values-kiali.yaml
        - platform-openshift.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.gitopsNamespace | quote }}
  syncPolicy:
    {{- include "gitops-hub-apps.syncPolicy" . | nindent 4 }}
{{- end }}
